<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PKWT Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#155BD5',
                        'primary-light': '#4A7FE8',
                        'primary-dark': '#0D3D8F',
                    },
                    fontFamily: {
                        sans: ['Poppins', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md">
        <!-- Logo/Header -->
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-gray-900 mb-2">JMax PKWT</h1>
            <p class="text-sm font-light text-gray-600">Sign in to your account</p>
        </div>

        <!-- Login Card -->
        <div class="bg-white rounded-lg p-8 border border-gray-200 transition-all duration-300 hover:shadow-lg" style="box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);">
            <form id="login-form" class="space-y-6">
                <!-- Email Input -->
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-md font-light focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-200"
                        placeholder="you@example.com"
                    >
                </div>

                <!-- Password Input -->
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-md font-light focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent transition-all duration-200"
                        placeholder="Enter your password"
                    >
                </div>

                <!-- Remember Me -->
                <div class="flex items-center">
                    <input
                        type="checkbox"
                        id="remember"
                        name="remember"
                        class="w-5 h-5 text-primary border-gray-300 rounded focus:ring-primary focus:ring-2 transition-all duration-200 cursor-pointer"
                    >
                    <label for="remember" class="ml-3 text-sm font-light text-gray-700 cursor-pointer">Remember me for 7 days</label>
                </div>

                <!-- Error Message -->
                <div id="error-message" class="hidden p-4 bg-red-50 border border-red-200 rounded-lg transition-all duration-300">
                    <p class="text-sm font-light text-red-600"></p>
                </div>

                <!-- Login Button -->
                <button
                    type="submit"
                    class="w-full px-6 py-2.5 bg-primary text-white font-medium rounded-md transition-all duration-200 hover:bg-primary-dark hover:shadow-md active:scale-95"
                >
                    Sign In
                </button>
            </form>
        </div>

        <!-- Footer -->
        <div class="text-center mt-6">
            <p class="text-sm font-light text-gray-600">JMax PKWT Dashboard &copy; 2025</p>
        </div>
    </div>

    <script src="/static/js/login.js"></script>
</body>
</html>
